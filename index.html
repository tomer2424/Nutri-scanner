<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nutri Scanner</title>
<meta name="description" content="Scan a food barcode and get nutrition values for the weight you enter.">
<meta name="theme-color" content="#15803d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nutri Scanner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css?v=dev">
</head>
<body>

<!-- The top bar and the bottom nav sit outside every view, so switching views
     never hides them. -->
<header class="topbar">
  <div class="topbar-inner">
    <h1 class="title">Nutri Scanner</h1>

    <button id="btn-options" class="icon-btn" type="button" aria-label="Options"
            aria-haspopup="menu" aria-expanded="false" aria-controls="options-menu">⋮</button>

    <div id="options-menu" class="options-menu" role="menu" hidden>
      <button id="btn-edit-goals" class="menu-item" type="button" role="menuitem">Edit Goals</button>
      <button id="btn-reset-counter" class="menu-item" type="button" role="menuitem">Reset Counter</button>
    </div>
  </div>
</header>

<main class="app">

  <!-- ───────────── HOME ───────────── -->
  <section id="view-home" class="view">
    <div class="totals">
      <!-- Cards are built in app.js from the MACROS list, so the metrics can
           never drift out of sync with the markup. -->
      <div id="totals-grid" class="headline"></div>

      <!-- novalidate: the app does its own validation with specific inline
           messages. Without it the browser's native constraint check fires
           first for min violations, suppressing our message entirely and
           making behaviour vary by browser and locale. -->
      <form id="targets-form" class="targets-form" novalidate hidden>
        <p class="hint targets-hint">Tick the macros to show on Home.</p>
        <!-- The checkbox and the goal are separate controls, so each gets its
             own label rather than one <label> wrapping both. -->
        <div class="targets-grid">
          <div class="target-field">
            <label class="target-show">
              <input id="show-calories" type="checkbox">
              <span>Calories (kcal)</span>
            </label>
            <input id="target-calories" class="text-input" type="number" inputmode="decimal" min="1" step="any"
                   aria-label="Calories goal (kcal)">
          </div>
          <div class="target-field">
            <label class="target-show">
              <input id="show-protein" type="checkbox">
              <span>Protein (g)</span>
            </label>
            <input id="target-protein" class="text-input" type="number" inputmode="decimal" min="1" step="any"
                   aria-label="Protein goal (g)">
          </div>
          <div class="target-field">
            <label class="target-show">
              <input id="show-carbs" type="checkbox">
              <span>Carbs (g)</span>
            </label>
            <input id="target-carbs" class="text-input" type="number" inputmode="decimal" min="1" step="any"
                   aria-label="Carbs goal (g)">
          </div>
          <div class="target-field">
            <label class="target-show">
              <input id="show-fat" type="checkbox">
              <span>Fat (g)</span>
            </label>
            <input id="target-fat" class="text-input" type="number" inputmode="decimal" min="1" step="any"
                   aria-label="Fat goal (g)">
          </div>
        </div>
        <p id="targets-error" class="error-text" role="alert" hidden></p>
        <button class="btn btn-secondary" type="submit">Save Goals</button>
        <button id="btn-goals-cancel" class="btn btn-link" type="button">Cancel</button>
      </form>
    </div>

    <button id="btn-scan" class="btn btn-primary" type="button">Scan Barcode</button>

    <button id="btn-manual-toggle" class="btn btn-secondary" type="button"
            aria-expanded="false" aria-controls="manual-form">Enter Barcode Manually</button>

    <form id="manual-form" class="manual-form" hidden>
      <input id="manual-barcode" class="text-input" type="text" inputmode="numeric"
             pattern="[0-9]*" autocomplete="off" placeholder="Barcode digits" enterkeyhint="go">
      <p id="manual-error" class="error-text" role="alert" hidden></p>
      <button class="btn btn-secondary" type="submit">Look up</button>
    </form>

    <button id="btn-custom-toggle" class="btn btn-secondary" type="button"
            aria-expanded="false" aria-controls="custom-form">Add Custom Item</button>

    <!-- novalidate for the same reason as the goals form: the app does its own
         validation with specific inline messages, and native constraint checks
         would fire first and suppress them. -->
    <form id="custom-form" class="custom-form" novalidate hidden>
      <input id="custom-name" class="text-input" type="text" autocomplete="off"
             maxlength="60" placeholder="Item name (optional)">

      <div class="targets-grid">
        <label class="target-field">
          <span>Calories (kcal)</span>
          <input id="custom-calories" class="text-input" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
        </label>
        <label class="target-field">
          <span>Protein (g)</span>
          <input id="custom-protein" class="text-input" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
        </label>
        <label class="target-field">
          <span>Carbs (g)</span>
          <input id="custom-carbs" class="text-input" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
        </label>
        <label class="target-field">
          <span>Fat (g)</span>
          <input id="custom-fat" class="text-input" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
        </label>
      </div>

      <label class="checkbox-field">
        <input id="custom-save-meal" type="checkbox">
        <span>Also save as a Quick Add</span>
      </label>

      <p id="custom-error" class="error-text" role="alert" hidden></p>
      <button id="btn-custom-submit" class="btn btn-secondary" type="submit">Log it</button>
    </form>
  </section>

  <!-- ────────────── LOG ───────────── -->
  <section id="view-log" class="view" hidden>
    <div id="meals-section" class="meals" hidden>
      <h2 class="meals-title">Saved Meals</h2>
      <div id="meals-list" class="meals-list"></div>
    </div>

    <div class="log">
      <h2 class="meals-title">Today's Log</h2>
      <p id="log-empty" class="hint log-empty">No items logged today yet</p>
      <div id="log-list" class="log-list"></div>
    </div>
  </section>

  <!-- ─────────── SCANNING ─────────── -->
  <section id="view-scanning" class="view" hidden>
    <div class="viewfinder">
      <video id="video" playsinline muted autoplay></video>
      <div class="reticle" aria-hidden="true"></div>
    </div>
    <p class="hint">Fill the box with the barcode. Hold steady.</p>
    <button id="btn-cancel-scan" class="btn btn-secondary" type="button">Cancel</button>
  </section>

  <!-- ─────────── LOADING ──────────── -->
  <section id="view-loading" class="view" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-text" class="hint" role="status">Looking up product…</p>
  </section>

  <!-- ─────────── RESULTS ──────────── -->
  <section id="view-results" class="view" hidden>
    <div class="product">
      <img id="product-image" class="product-image" alt="" hidden>
      <div class="product-meta">
        <h2 id="product-name" class="product-name"></h2>
        <p id="product-brand" class="product-brand"></p>
        <p id="product-barcode" class="product-barcode"></p>
      </div>
    </div>

    <label class="field-label" for="weight-results">Weight in grams</label>
    <!-- No novalidate needed: this isn't in a form, so the browser never runs a
         constraint check. app.js validates on every keystroke instead. -->
    <input id="weight-results" class="weight-input" type="number" inputmode="decimal"
           min="0" max="10000" step="any" enterkeyhint="done">
    <p id="weight-error" class="error-text" role="alert" hidden></p>

    <div id="headline" class="headline"></div>
    <dl id="secondary" class="secondary"></dl>
    <p id="result-note" class="note" hidden></p>

    <button id="btn-add-total" class="btn btn-primary" type="button">Add to Daily Total</button>
    <button id="btn-save-meal" class="btn btn-secondary" type="button">Save as Quick Add</button>
    <button id="btn-reset" class="btn btn-secondary" type="button">Scan Another Product</button>
  </section>

  <!-- ──────────── ERROR ───────────── -->
  <section id="view-error" class="view" hidden>
    <div class="error-box">
      <p id="error-message" role="alert"></p>
      <p id="error-detail" class="error-detail" hidden></p>
    </div>
    <button id="btn-error-reset" class="btn btn-primary" type="button">Scan Another Product</button>
  </section>

  <p id="diagnostics" class="diagnostics">engine: starting…</p>

</main>

<!-- Adding a tab: a button here with id="tab-<name>", a matching
     <section id="view-<name>"> above, and "<name>" in TABS in app.js. -->
<nav class="tabbar" aria-label="Main">
  <div class="tabbar-inner">
    <button id="tab-home" class="tab" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 12 3l9 7.5"/>
        <path d="M5 9v11h5v-6h4v6h5V9"/>
      </svg>
      <span>Home</span>
    </button>
    <button id="tab-log" class="tab" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="4" width="14" height="17" rx="2"/>
        <path d="M9 4V3h6v1"/>
        <path d="M9 10h6M9 14h6M9 18h3"/>
      </svg>
      <span>Log</span>
    </button>
  </div>
</nav>

<canvas id="crop" hidden></canvas>
<!-- ?v= is rewritten to the commit SHA when CI publishes. GitHub Pages serves
     every file with max-age=600 and caches each independently, so without this
     a deploy can pair a fresh index.html with a ten-minute-old app.js: the new
     markup renders, the code wiring it up is missing, and nothing errors.
     Versioning the URL means new HTML always asks for a URL no cache has seen,
     and stale HTML keeps asking for the matching stale JS — consistent either
     way. A service worker cannot do this job: Chrome serves cached scripts
     without ever dispatching a fetch event to it. -->
<script type="module" src="app.js?v=dev"></script>
</body>
</html>

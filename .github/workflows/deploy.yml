name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gates the deploy. Deliberately the --offline suite: it is fixture-backed and
  # fully deterministic, so a failure here always means *our* code broke. The
  # live API is checked in the `contract` job instead — a third party's uptime
  # must not be able to veto a deploy.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node test/run.mjs --offline

  # Informational, and deliberately not a gate. Catches Open Food Facts changing
  # its API shape out from under us — the one failure that is otherwise silent,
  # since our code would keep working and simply stop finding data.
  contract:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the live Open Food Facts contract
        run: node test/run.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Allowlist by extension rather than a list of things to exclude. Every
      # file the site serves is a top-level file of one of these types, so
      # test/ and .github/ are left out by construction — a new test directory
      # can never leak into the published site by someone forgetting to add it
      # to an exclude list. An unmatched glob fails the step loudly.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp *.html *.js *.css *.webmanifest *.png _site/

          # Stamp the asset URLs with this commit so a deploy can never leave a
          # fresh index.html pointing at a cached older app.js. Pages serves
          # everything with max-age=600 and caches each file independently.
          sed -i "s/?v=dev/?v=${GITHUB_SHA:0:8}/g" _site/index.html
          grep -q "?v=${GITHUB_SHA:0:8}" _site/index.html

          test -f _site/index.html
          test -f _site/app.js
          test ! -e _site/test
          echo "Publishing:" && ls -1 _site
          echo "Asset versions:" && grep -o '?v=[0-9a-f]*' _site/index.html | sort -u

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
